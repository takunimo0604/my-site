<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>타쿠니모 | 자기소개</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>타쿠니모</h1>
    <p class="tagline">호기심을 따라 하나씩 만들어 가는 사람입니다.</p>
  </header>

  <main>
    <section id="about" class="section">
      <h2>소개</h2>
      <p>안녕하세요, 타쿠니모입니다. 새로운 것을 배우고 직접 만들어 보는 일을 즐깁니다. 이 페이지는 저를 간단히 소개하려고 만든 첫 웹사이트예요.</p>
    </section>

    <section id="favorites" class="section">
      <h2>좋아하는 것 3가지</h2>
      <ul class="cards">
        <li class="card">
          <span class="emoji">⭐</span>
          <h3>박지훈</h3>
          <p>보고만 있어도 기분이 좋아지는 최애입니다.</p>
        </li>
        <li class="card">
          <span class="emoji">💰</span>
          <h3>돈</h3>
          <p>많을수록 마음이 든든해집니다.</p>
        </li>
        <li class="card">
          <span class="emoji">🍚</span>
          <h3>밥</h3>
          <p>맛있는 한 끼가 하루의 가장 큰 낙입니다.</p>
        </li>
      </ul>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; <span id="year"></span> 타쿠니모. 모든 권리 보유.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
