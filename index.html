<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>타쿠니모 | 자기소개</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>타쿠니모</h1>
    <p class="tagline">호기심으로 하나씩 만들어 가는 사람입니다.</p>
  </header>

  <main>
    <section id="about" class="section">
      <h2>소개</h2>
      <p>안녕하세요, 타쿠니모입니다. 새로운 것을 배우고 직접 만들어 보는 일을 좋아합니다. 이 페이지는 저를 간단히 소개하기 위해 만든 첫 웹사이트입니다.</p>
    </section>

    <section id="favorites" class="section">
      <h2>좋아하는 것 3가지</h2>
      <ul class="cards">
        <li class="card">
          <span class="emoji">💻</span>
          <h3>코딩</h3>
          <p>아이디어가 화면에서 움직일 때 가장 즐겁습니다.</p>
        </li>
        <li class="card">
          <span class="emoji">🎵</span>
          <h3>음악</h3>
          <p>작업할 때도 쉴 때도 늘 곁에 두고 듣습니다.</p>
        </li>
        <li class="card">
          <span class="emoji">🚶</span>
          <h3>산책</h3>
          <p>걸으면서 생각을 정리하는 시간을 좋아합니다.</p>
        </li>
      </ul>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; <span id="year"></span> 타쿠니모. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
